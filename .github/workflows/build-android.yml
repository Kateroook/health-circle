name: Build Android

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (prod or stage)'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - stage
      artifact_type:
        description: 'Artifact Type (apk or aab)'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab

jobs:
  build:
    name: Build Android Artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/client/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Restore google-services.json
        run: |
          # Decode the file directly to an absolute path in the workspace
          echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" | base64 --decode > ${{ github.workspace }}/apps/client/google-services.json

      - name: Build Android Artifact
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ github.event.inputs.environment == 'prod' && secrets.EXPO_PUBLIC_API_URL || secrets.STAGING_API_BASE_URL }}
          GOOGLE_SERVICES_JSON: ${{ github.workspace }}/apps/client/google-services.json
        run: |
          if [ "${{ github.event.inputs.artifact_type }}" == "aab" ]; then
            PROFILE="production"
            EXTENSION="aab"
          else
            PROFILE="preview"
            EXTENSION="apk"
          fi
          eas build --platform android --profile $PROFILE --local --non-interactive --output build.$EXTENSION
          echo "EXTENSION=$EXTENSION" >> $GITHUB_ENV

      - name: Define Artifact Name
        id: artifact_name
        run: |
          echo "NAME=health-circle-${{ github.event.inputs.environment }}-${{ github.run_number }}-android" >> $GITHUB_OUTPUT
        shell: bash

      - name: Rename Artifact
        run: mv build.${{ env.EXTENSION }} ${{ steps.artifact_name.outputs.NAME }}.${{ env.EXTENSION }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.NAME }}
          path: apps/client/${{ steps.artifact_name.outputs.NAME }}.${{ env.EXTENSION }}
          retention-days: 7

      - name: Get Last Successful Head SHA
        id: last_sha
        if: success()
        run: |
          SHA=$(gh run list --workflow "Build Android" --branch ${GITHUB_REF_NAME} --status success --limit 1 --json headSha --jq '.[0].headSha' || echo "")
          echo "SHA=$SHA" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get Commits since last success
        id: get_commits
        if: success()
        run: |
          if [ -z "${{ steps.last_sha.outputs.SHA }}" ]; then
            # If no previous success, get last 20 commits
            JSON_COMMITS=$(git log --pretty=format:'%s' -n 20 | jq -R -s -c 'split("\n") | map(select(length > 0) | {message: .})')
          else
            JSON_COMMITS=$(git log ${{ steps.last_sha.outputs.SHA }}..HEAD --pretty=format:'%s' | jq -R -s -c 'split("\n") | map(select(length > 0) | {message: .})')
          fi
          echo "COMMITS_JSON=$JSON_COMMITS" >> $GITHUB_ENV

      - name: Generate Build Summary
        id: build_summary
        if: success()
        env:
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          COMMITS_JSON: ${{ env.COMMITS_JSON }}
        run: |
          SUMMARY=$(node ${{ github.workspace }}/scripts/generate-build-summary.js)
          {
            echo "SUMMARY<<EOF"
            echo "$SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Build Notification to Telegram
        if: success()
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUMMARY: ${{ steps.build_summary.outputs.SUMMARY }}
          ARTIFACT_NAME: ${{ steps.artifact_name.outputs.NAME }}
        run: |
          SAFE_SUMMARY="${SUMMARY:-No summary available.}"
          
          TEXT="✅ *Android Build Success*

          📦 *Artifact:* ${ARTIFACT_NAME}.${{ env.EXTENSION }}
          🔢 *Run:* ${{ github.run_number }}
          🔗 [Download Artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ✨ *What's Changed:*
          $SAFE_SUMMARY

          _Note: The artifact is available for download at the bottom of the run page._"

          # Convert to JSON and send using jq safely
          PAYLOAD=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$TEXT" \
            --arg parse_mode "Markdown" \
            '{chat_id: $chat_id, text: $text, parse_mode: $parse_mode}')
          
          curl -X POST \
               -H 'Content-Type: application/json' \
               -d "$PAYLOAD" \
               https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage

      - name: Notify Failure to Telegram
        if: failure()
        run: |
          curl -X POST \
               -H 'Content-Type: application/json' \
               -d '{"chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}", "text": "❌ *Android Build Failed*
               
               🔢 *Run:* ${{ github.run_number }}
               🔗 [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "parse_mode": "Markdown"}' \
               https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage
