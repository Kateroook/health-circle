name: Build Android APK

on:
  workflow_dispatch:


jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/client/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || env.EXPO_PUBLIC_API_URL }}
        run: eas build --platform android --profile preview --local --non-interactive --output build.apk --verbose-logs

      - name: Define Artifact Name
        id: artifact_name
        run: |
          echo "NAME=health-circle-dev-${{ github.run_number }}-android" >> $GITHUB_OUTPUT
        shell: bash

      - name: Rename APK
        run: mv build.apk ${{ steps.artifact_name.outputs.NAME }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.NAME }}
          path: apps/client/${{ steps.artifact_name.outputs.NAME }}.apk
          retention-days: 7

      - name: Send Build Notification to Telegram
        if: success()
        run: |
          curl -X POST \
               -H 'Content-Type: application/json' \
               -d '{"chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}", "text": "✅ *Android Build Success*\n\n📦 *Artifact:* ${{ steps.artifact_name.outputs.NAME }}.apk\n🔢 *Run:* ${{ github.run_number }}\n🔗 [Download Artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n_Note: The artifact is available for download at the bottom of the run page._", "parse_mode": "Markdown"}' \
               https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage

      - name: Notify Failure to Telegram
        if: failure()
        run: |
          curl -X POST \
               -H 'Content-Type: application/json' \
               -d '{"chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}", "text": "❌ *Android Build Failed*
               
               🔢 *Run:* ${{ github.run_number }}
               🔗 [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "parse_mode": "Markdown"}' \
               https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage

