name: Expo Preview Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize]
    paths:
      - "apps/client/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/client
    steps:
      - name: 🏗 Checkout repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: |
          if [ -f "yarn.lock" ]; then
            yarn install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm install --registry https://registry.npmjs.org/
          else
            npm install
          fi

      - name: 🔍 Debug EAS setup
        run: |
          eas whoami || echo "❌ EAS auth failed"
          [[ -f app.json ]] && cat app.json | jq '.expo.extra.eas.projectId // "PROJECT_ID_MISSING"'
          [[ -f eas.json ]] || exit 1

      - name: 📱 Create EAS Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BRANCH_NAME="preview-${{ github.sha }}"
          eas update --branch $BRANCH_NAME --message "Preview from ${{ github.ref_name }}" --json --non-interactive --environment preview > update_output.json

          UPDATE_GROUP_ID=$(jq -r '.[] | select(.platform) | .group' update_output.json | head -1)
          if [ -z "$UPDATE_GROUP_ID" ] || [ "$UPDATE_GROUP_ID" = "null" ]; then
            UPDATE_GROUP_ID=$(jq -r '.[0].group // .group // empty' update_output.json)
          fi
          [ -z "$UPDATE_GROUP_ID" ] && (cat update_output.json; exit 1)

          echo "EAS_BRANCH=$BRANCH_NAME" >> $GITHUB_ENV
          echo "UPDATE_GROUP_ID=$UPDATE_GROUP_ID" >> $GITHUB_ENV

      - name: 🔗 Generate URLs
        run: |
          PROJECT_ID=$(jq -r '.expo.extra.eas.projectId' app.json)
          [ -z "$PROJECT_ID" ] && (cat app.json; exit 1)

          PREVIEW_URL="exp://u.expo.dev/$PROJECT_ID/group/${UPDATE_GROUP_ID}"
          QR_CODE_URL="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=$(node -p "encodeURIComponent('$PREVIEW_URL')")"

          echo "PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_ENV
          echo "QR_CODE_URL=$QR_CODE_URL" >> $GITHUB_ENV
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV

      - name: Send or Update Telegram Message
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            const prUrl = context.payload.pull_request?.html_url;
            const branch = context.payload.pull_request?.head?.ref;
            const author = context.actor;
            const sha = github.sha;

            const text = prNumber
              ? `🚀 *Expo Preview Build for PR #${prNumber}*
            🔗 [PR](${prUrl})
            🌿 Branch: \`${branch}\`
            👤 Author: \`${author}\`
            📲 Preview: \`${process.env.PREVIEW_URL}\``
                          : `🚀 *Expo Preview Build (Manual Trigger)*
            🌿 Branch: \`${github.ref_name}\`
            👤 Triggered by: \`${author}\`
            📲 Preview: \`${process.env.PREVIEW_URL}\``;

            const fetchMessages = async () => {
              const res = await fetch(`https://api.telegram.org/bot${process.env.TELEGRAM_BOT_TOKEN}/getUpdates?limit=100`);
              const data = await res.json();
              return data.result.filter(m => m.message?.text?.includes(`Expo Preview Build for PR #${prNumber}`));
            };

            if (prNumber) {
              const messages = await fetchMessages();
              const latestMessage = messages[messages.length - 1];

              if (latestMessage) {
                await fetch(`https://api.telegram.org/bot${process.env.TELEGRAM_BOT_TOKEN}/editMessageText`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    chat_id: process.env.TELEGRAM_CHAT_ID,
                    message_id: latestMessage.message.message_id,
                    parse_mode: 'Markdown',
                    text: text
                  })
                });
              } else {
                await fetch(`https://api.telegram.org/bot${process.env.TELEGRAM_BOT_TOKEN}/sendMessage`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    chat_id: process.env.TELEGRAM_CHAT_ID,
                    parse_mode: 'Markdown',
                    text: text
                  })
                });
              }
            } else {
              // Manual trigger: always send new message
              await fetch(`https://api.telegram.org/bot${process.env.TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  chat_id: process.env.TELEGRAM_CHAT_ID,
                  parse_mode: 'Markdown',
                  text: text
                })
              });
            }

      - name: 📊 PR Comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 📱 EAS Preview Ready

            <div align="center">
            ![QR Code](${{ env.QR_CODE_URL }})
            </div>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('📱 EAS Preview'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
