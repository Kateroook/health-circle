name: Mobile Tests

on:
  workflow_run:
    workflows: ["Playwright Tests"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Окремий джоб: перевірити, чи треба взагалі запускатись ────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decision.outputs.should_run }}
      head_sha:   ${{ steps.decision.outputs.head_sha }}
    steps:
      - name: Decide whether to run
        id: decision
        uses: actions/github-script@v7
        with:
          script: |
            // workflow_dispatch — завжди запускаємо
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_run', 'true');
              core.setOutput('head_sha', context.sha);
              return;
            }

            const run = context.payload.workflow_run;

            // Playwright впав або тригер не PR — пропускаємо
            if (run.conclusion !== 'success' || run.event !== 'pull_request') {
              core.setOutput('should_run', 'false');
              core.setOutput('head_sha', '');
              return;
            }

            const prNumber = run.pull_requests[0]?.number;

            let files = [];
            if (prNumber) {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
            } else {
              const { data: commit } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: run.head_sha,
              });
              files = commit.files || [];
            }
            const relevant = files.some(f =>
              f.filename.startsWith('apps/core-api/') ||
              f.filename.startsWith('apps/test-framework/src/mobile/') ||
              f.filename.startsWith('apps/client/') || 
              f.filename === '.github/workflows/mobile.yml'
            );
            core.setOutput('should_run', String(relevant));
            core.setOutput('head_sha', run.head_sha);

  # ─── Основний джоб: мобільні тести ─────────────────────────────────────────
  mobile-test:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    timeout-minutes: 90
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/test-framework
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: apps/test-framework/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install client dependencies
        working-directory: apps/client
        run: npm ci

      - name: Restore google-services.json
        run: |
          # Decode the file directly to an absolute path in the workspace
          echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" | base64 --decode > ${{ github.workspace }}/apps/client/google-services.json

      - name: Build APK (staging)
        env:
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICES_JSON: ${{ github.workspace }}/apps/client/google-services.json
        run: npm run build:apk:stage

      - name: Run mobile tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86
          target: google_apis
          avd-name: mobile-ci-avd
          emulator-options: >-
            -no-snapshot-save -no-window
            -gpu swiftshader_indirect
            -noaudio -no-boot-anim
          disable-animations: true
          script: cd apps/test-framework && npx wdio run ./src/mobile/wdio.conf.ts
        env:
          CI: true
          # Appium capabilities — мають збігатись з api-level і avd-name вище
          APPIUM__PLATFORM_VERSION: '10'        # API 29 = Android 10
          APPIUM__DEVICE_NAME: 'emulator-5554'  # стандартний UDID першого емулятора
          # Backend / DB
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          HEALTHCIRCLE_POSTGRES_HOST: ${{ secrets.STAGING_POSTGRES_HOST }}
          HEALTHCIRCLE_POSTGRES_PORT: ${{ secrets.STAGING_POSTGRES_PORT }}
          HEALTHCIRCLE_POSTGRES_USER: ${{ secrets.STAGING_POSTGRES_USER }}
          HEALTHCIRCLE_POSTGRES_PASS: ${{ secrets.STAGING_POSTGRES_PASS }}
          HEALTHCIRCLE_POSTGRES_DB_NAME: ${{ secrets.STAGING_POSTGRES_DB_NAME }}
          HEALTHCIRCLE_POSTGRES_SSL: ${{ secrets.POSTGRES_SSL }}
          TEST_EMAIL_USER: ${{ secrets.TEST_EMAIL_USER }}
          TEST_EMAIL_PASSWORD: ${{ secrets.TEST_EMAIL_PASSWORD }}
          MOCK_ADMIN_URL: ${{ secrets.MOCK_ADMIN_URL }}

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: ${{ !cancelled() }}
        with:
          name: '${{ github.workflow }} Results'
          path: 'apps/test-framework/test-results/wdio-results-*.xml'
          reporter: java-junit
          fail-on-error: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-test-report
          path: apps/test-framework/test-results/
          retention-days: 30