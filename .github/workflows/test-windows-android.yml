name: Test Android Build (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - test/windows-build

jobs:
  test-windows:
    name: Build Android (Windows Runner)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/client/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        working-directory: apps\client
        run: npm ci

      - name: Restore google-services.json
        working-directory: apps\client
        shell: pwsh
        run: |
          if ("${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" -ne "") {
            [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}")) | Out-File -FilePath google-services.json -Encoding utf8
          } else {
            Write-Host "Google Services JSON secret not found, creating a placeholder"
            "{}" | Out-File -FilePath google-services.json -Encoding utf8
          }

      - name: Build Android Debug
        working-directory: apps\client\android
        run: .\gradlew.bat :app:assembleDebug --no-daemon
        env:
          GOOGLE_SERVICES_JSON: ..\google-services.json
