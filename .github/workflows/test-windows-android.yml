name: Test Android Build (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - test/windows-build

jobs:
  test-windows:
    name: Build Android (Windows Runner)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./apps/client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/client/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Restore google-services.json
        shell: bash
        run: |
          if [ -n "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" | base64 --decode > ${{ github.workspace }}/apps/client/google-services.json
          else
            echo "Google Services JSON secret not found, creating a placeholder"
            echo "{}" > ${{ github.workspace }}/apps/client/google-services.json
          fi

      - name: Build Android Debug
        run: ./gradlew.bat :app:assembleDebug --no-daemon
        env:
          GOOGLE_SERVICES_JSON: ${{ github.workspace }}/apps/client/google-services.json
