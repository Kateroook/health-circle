name: Build Mobile Apps (Android & iOS)

on:
  workflow_dispatch:

jobs:
  # --- ANDROID JOB ---
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/client/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Restore google-services.json
        run: |
          echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" | base64 --decode > ${{ github.workspace }}/apps/client/google-services.json

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          GOOGLE_SERVICES_JSON: ${{ github.workspace }}/apps/client/google-services.json
        run: eas build --platform android --profile preview --local --non-interactive --output build.apk --verbose-logs

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: health-circle-dev-${{ github.run_number }}-android
          path: apps/client/build.apk
          retention-days: 7

  # --- IOS JOB ---
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./apps/client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Restore GoogleService-Info.plist
        run: |
          echo "${{ secrets.FIREBASE_GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > ${{ github.workspace }}/apps/client/GoogleService-Info.plist

      - name: Build iOS Simulator App
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ github.workspace }}/apps/client/GoogleService-Info.plist
        run: eas build --platform ios --profile preview --local --non-interactive --output build.tar.gz --verbose-logs

      # Using the job-level name directly in the artifact to keep it simple
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: health-circle-dev-${{ github.run_number }}-ios
          path: apps/client/build.tar.gz
          retention-days: 7

  # --- NOTIFICATION JOB ---
  # This runs after BOTH builds finish (or fail)
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always()
    steps:
      - name: Send Telegram Notification
        run: |
          # Check statuses of the previous jobs
          ANDROID_STATUS="${{ needs.build-android.result }}"
          IOS_STATUS="${{ needs.build-ios.result }}"
          
          MESSAGE="📱 *Mobile Build Report* (Run #${{ github.run_number }})%0A%0A"
          MESSAGE="${MESSAGE}🤖 Android: ${ANDROID_STATUS^^}%0A"
          MESSAGE="${MESSAGE}🍎 iOS: ${IOS_STATUS^^}%0A%0A"
          MESSAGE="${MESSAGE}🔗 [View Build Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          curl -X POST \
               -H 'Content-Type: application/json' \
               -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\", \"text\": \"$MESSAGE\", \"parse_mode\": \"Markdown\"}" \
               https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage