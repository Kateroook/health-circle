      #     curl -X POST \
      #          -H 'Content-Type: application/json' \
      #          -d '{"chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}", "text": "✅ *iOS Build Success*\n\n📦 *Artifact:* ${{ steps.artifact_name.outputs.NAME }}.tar.gz\n🔢 *Run:* ${{ github.run_number }}\n🔗 [Download Artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n_Note: The artifact is available for download at the bottom of the run page._", "parse_mode": "Markdown"}' \
      #          https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage

