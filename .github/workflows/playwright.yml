name: Playwright Tests

on:
  pull_request:
    branches: [dev]
    paths:
      - 'apps/core-api/**'
      - 'apps/test-framework/**'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/test-framework

    steps:
      - uses: actions/checkout@v4

      # --- PR: deploy PR branch to Railway staging ---
      - name: Deploy to Railway staging
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          npm install -g @railway/cli
          railway variables --set COMMIT_SHA=$GITHUB_SHA \
            --service ${{ secrets.RAILWAY_SERVICE_ID }} \
            --environment staging \
            --skip-deploys
          railway up \
            --service ${{ secrets.RAILWAY_SERVICE_ID }} \
            --environment staging \
            --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: apps/test-framework/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # --- PR: wait for staging to serve this exact commit ---
      - name: Wait for staging to deploy
        if: github.event_name == 'pull_request'
        run: |
          echo "Waiting for commit $GITHUB_SHA on staging..."
          for i in $(seq 1 36); do
            DEPLOYED=$(curl -sf "$STAGING_API_BASE_URL/api/health" | jq -r '.version // empty' 2>/dev/null || echo "")
            echo "Attempt $i/36 — deployed: ${DEPLOYED:-none} | expected: $GITHUB_SHA"
            if [ "$DEPLOYED" = "$GITHUB_SHA" ]; then echo "Staging is live!"; exit 0; fi
            sleep 10
          done
          echo "Timed out" && exit 1
        env:
          STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}


      - name: Run Playwright tests
        run: npx playwright test --grep "@smoke" --grep-invert "@bug"
        env:
          CI: true
          API_BASE_URL: ${{ github.event_name == 'pull_request' && vars.STAGING_API_BASE_URL || vars.API_BASE_URL }}
          HEALTHCIRCLE_POSTGRES_HOST: ${{ github.event_name == 'pull_request' && secrets.STAGING_POSTGRES_HOST || secrets.POSTGRES_HOST }}
          HEALTHCIRCLE_POSTGRES_PORT: ${{ github.event_name == 'pull_request' && secrets.STAGING_POSTGRES_PORT || secrets.POSTGRES_PORT }}
          HEALTHCIRCLE_POSTGRES_USER: ${{ github.event_name == 'pull_request' && secrets.STAGING_POSTGRES_USER || secrets.POSTGRES_USER }}
          HEALTHCIRCLE_POSTGRES_PASS: ${{ github.event_name == 'pull_request' && secrets.STAGING_POSTGRES_PASS || secrets.POSTGRES_PASS }}
          HEALTHCIRCLE_POSTGRES_DB_NAME: ${{ github.event_name == 'pull_request' && secrets.STAGING_POSTGRES_DB_NAME || secrets.POSTGRES_DB_NAME }}
          HEALTHCIRCLE_POSTGRES_SSL: ${{ secrets.POSTGRES_SSL }}
          TEST_EMAIL_USER: ${{ secrets.TEST_EMAIL_USER }}
          TEST_EMAIL_PASSWORD: ${{ secrets.TEST_EMAIL_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/test-framework/playwright-report/
          retention-days: 30